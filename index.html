<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Performance Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #181b24;
            --border: #262a36;
            --text: #e2e8f0;
            --muted: #8492a6;
            --purple: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 32px 20px;
        }
        .container {
            max-width: 1040px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--green);
        }
        .dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
        }
        .banner {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            display: flex;
            justify-content: space-between;
        }
        .banner.flat {
            background: var(--card);
            border-color: var(--border);
            color: var(--muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
        }
        .card-label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        .card-val {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .chart-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
        }
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quantitative Strategy Performance</h1>
            <div class="badge"><div class="dot"></div> LIVE</div>
        </div>

        <div class="banner flat">
            <div><strong>Position:</strong> Flat (Cash)</div>
            <div>Awaiting signal</div>
        </div>
    
        <div class="grid">
            <div class="card">
                <div class="card-label">Current Equity</div>
                <div class="card-val">$1,093.87</div>
            </div>
            <div class="card">
                <div class="card-label">Profit Factor</div>
                <div class="card-val">0.49</div>
            </div>
            <div class="card">
                <div class="card-label">Win Rate</div>
                <div class="card-val">17.1%</div>
            </div>
            <div class="card">
                <div class="card-label">Max Drawdown</div>
                <div class="card-val" style="color: var(--red);">-8.10%</div>
            </div>
            <div class="card">
                <div class="card-label">Payoff Ratio</div>
                <div class="card-val">2.37x</div>
            </div>
            <div class="card">
                <div class="card-label">Trades</div>
                <div class="card-val">35</div>
            </div>
        </div>

        <div class="chart-wrap">
            <div id="chart" style="height: 480px;"></div>
        </div>

        <div class="footer">
            Last update: 2026-10-12 16:37 UTC
        </div>
    </div>

    <script>
        const times = ["10-11 05:11", "10-11 05:50", "10-11 10:31", "10-11 17:40", "10-11 17:40", "10-11 18:42", "10-11 18:43", "10-11 19:35", "10-11 23:15", "10-12 02:40", "10-12 06:42", "10-12 06:57", "10-12 08:16", "10-12 08:56", "10-12 09:18", "10-12 09:18", "10-12 10:17", "10-12 11:04", "10-12 11:04", "10-12 11:22", "10-12 11:22", "10-12 11:40", "10-12 11:40", "10-12 11:41", "10-12 11:41", "10-12 12:32", "10-12 12:32", "10-12 12:35", "10-12 12:35", "10-12 12:55", "10-12 12:55", "10-12 13:30", "10-12 13:30", "10-12 13:31", "10-12 13:31"];
        const equities = [1156.68, 1145.44, 1139.46, 1157.82, 1185.88, 1173.94, 1168.72, 1162.69, 1156.82, 1170.81, 1164.5, 1152.72, 1181.24, 1175.84, 1177.84, 1177.84, 1190.27, 1166.59, 1166.59, 1160.06, 1160.06, 1147.8, 1147.8, 1141.54, 1141.54, 1129.34, 1129.34, 1123.35, 1123.35, 1112.17, 1112.17, 1105.86, 1105.86, 1093.87, 1093.87];
        const drawdowns = [0.0, -0.97, -1.49, 0.0, 0.0, -1.01, -1.45, -1.96, -2.45, -1.27, -1.8, -2.8, -0.39, -0.85, -0.68, -0.68, 0.0, -1.99, -1.99, -2.54, -2.54, -3.57, -3.57, -4.09, -4.09, -5.12, -5.12, -5.62, -5.62, -6.56, -6.56, -7.09, -7.09, -8.1, -8.1];

        const traceEquity = {
            x: times,
            y: equities,
            name: 'Equity ($)',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#8b5cf6', width: 2 },
            marker: { color: '#a78bfa', size: 5 },
            xaxis: 'x',
            yaxis: 'y'
        };

        const traceDD = {
            x: times,
            y: drawdowns,
            name: 'Drawdown (%)',
            type: 'scatter',
            mode: 'lines',
            line: { color: '#ef4444', width: 1.5 },
            fill: 'tozeroy',
            fillcolor: 'rgba(239, 68, 68, 0.1)',
            xaxis: 'x',
            yaxis: 'y2'
        };

        const layout = {
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent',
            margin: { t: 20, r: 20, b: 40, l: 60 },
            showlegend: false,
            grid: { rows: 2, columns: 1, pattern: 'independent', roworder: 'top to bottom' },
            yaxis: {
                title: 'Equity ($)',
                range: [1077.46195, 1208.12405],
                gridcolor: '#1f2430',
                zeroline: false,
                domain: [0.36, 1.0],
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' }
            },
            yaxis2: {
                title: 'Drawdown (%)',
                gridcolor: '#1f2430',
                zerolinecolor: '#262a36',
                domain: [0.0, 0.26],
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' }
            },
            xaxis: {
                gridcolor: '#1f2430',
                tickfont: { color: '#8492a6' },
                showticklabels: false
            },
            xaxis2: {
                gridcolor: '#1f2430',
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' }
            }
        };

        Plotly.newPlot('chart', [traceEquity, traceDD], layout, { responsive: true, displayModeBar: false });
    </script>
</body>
</html>
