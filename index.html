<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Performance Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #181b24;
            --border: #262a36;
            --text: #e2e8f0;
            --muted: #8492a6;
            --purple: #8b5cf6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 32px 20px;
        }
        .container {
            max-width: 1040px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.35rem;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--green);
        }
        .dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
        }
        .banner {
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 6px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            display: flex;
            justify-content: space-between;
        }
        .banner.flat {
            background: var(--card);
            border-color: var(--border);
            color: var(--muted);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
        }
        .card-label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }
        .card-val {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .chart-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
        }
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quantitative Strategy Performance (M2 Climax)</h1>
            <div class="badge"><div class="dot"></div> LIVE</div>
        </div>

        <div class="banner flat">
            <div><strong>Position:</strong> Flat (USDT Cash)</div>
            <div>Awaiting M2 Climax signal</div>
        </div>
    
        <div class="grid">
            <div class="card">
                <div class="card-label">Current Equity</div>
                <div class="card-val">$2,359.91</div>
            </div>
            <div class="card">
                <div class="card-label">Net Realized PnL</div>
                <div class="card-val" style="color: var(--red);">$-8.70</div>
            </div>
            <div class="card">
                <div class="card-label">Profit Factor</div>
                <div class="card-val">0.97</div>
            </div>
            <div class="card">
                <div class="card-label">Win Rate</div>
                <div class="card-val">26.7%</div>
            </div>
            <div class="card">
                <div class="card-label">Max Drawdown</div>
                <div class="card-val" style="color: var(--red);">-27.21%</div>
            </div>
            <div class="card">
                <div class="card-label">Payoff Ratio</div>
                <div class="card-val">2.66x</div>
            </div>
            <div class="card">
                <div class="card-label">Trades</div>
                <div class="card-val">15</div>
            </div>
        </div>

        <div class="chart-wrap">
            <div id="chart" style="height: 480px;"></div>
        </div>

        <div class="footer">
            Last update: 2026-10-20 02:55 UTC
        </div>
    </div>

    <script>
        const times = ["Start", "10-15 12:08", "10-15 18:17", "10-16 12:33", "10-18 15:02", "10-18 15:02", "10-18 23:26", "10-18 23:26", "10-18 23:27", "10-18 23:27", "10-19 00:44", "10-19 00:44", "10-19 00:46", "10-19 00:46", "10-19 01:32", "10-19 01:32"];
        const cumPnl = [0.0, 12.93, 42.79, 27.46, 138.6, 249.73, 223.95, 198.17, 174.86, 151.55, 113.65, 75.74, 57.34, 38.94, 15.12, -8.7];
        const drawdowns = [0.0, 0.0, 0.0, -2.06, 0.0, 0.0, -2.71, -5.43, -7.88, -10.34, -14.33, -18.32, -20.26, -22.19, -24.7, -27.21];

        const traceEquity = {
            x: times,
            y: cumPnl,
            name: 'Cumulative PnL ($)',
            type: 'scatter',
            mode: 'lines+markers',
            line: { color: '#8b5cf6', width: 2.5 },
            marker: { color: '#a78bfa', size: 6 },
            fill: 'tozeroy',
            fillcolor: 'rgba(139, 92, 246, 0.08)',
            xaxis: 'x',
            yaxis: 'y'
        };

        const traceDD = {
            x: times,
            y: drawdowns,
            name: 'Drawdown (%)',
            type: 'scatter',
            mode: 'lines',
            line: { color: '#ef4444', width: 1.5 },
            fill: 'tozeroy',
            fillcolor: 'rgba(239, 68, 68, 0.12)',
            xaxis: 'x2',
            yaxis: 'y2'
        };

        const layout = {
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent',
            margin: { t: 20, r: 20, b: 45, l: 65 },
            showlegend: false,
            yaxis: {
                title: 'Cum. PnL ($)',
                range: [-33.673, 287.18949999999995],
                gridcolor: '#1f2430',
                zerolinecolor: '#262a36',
                domain: [0.35, 1.0],
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' }
            },
            yaxis2: {
                title: 'Drawdown (%)',
                gridcolor: '#1f2430',
                zerolinecolor: '#262a36',
                domain: [0.0, 0.25],
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' }
            },
            xaxis: {
                gridcolor: '#1f2430',
                tickfont: { color: '#8492a6' },
                showticklabels: false,
                anchor: 'y'
            },
            xaxis2: {
                gridcolor: '#1f2430',
                tickfont: { color: '#8492a6' },
                titlefont: { color: '#cbd5e1' },
                anchor: 'y2'
            }
        };

        Plotly.newPlot('chart', [traceEquity, traceDD], layout, { responsive: true, displayModeBar: false });
    </script>
</body>
</html>
